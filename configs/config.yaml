seed: 42

paths:
  raw: data/raw
  interim: data/interim
  processed: data/processed
  results: reports/results
  figures: reports/figures

scope:
  store_id: CA_1          # final choice made in Phase 2 (see DECISIONS D-002)
  history_start_d: 1      # switch to 1000 if RAM is limited

forecast:
  horizon: 28
  min_lag: 28             # direct strategy: every target lag >= horizon

backtest:
  folds:                  # [train_end, valid_start, valid_end] as d_ indices
    - [1801, 1802, 1829]
    - [1829, 1830, 1857]
    - [1857, 1858, 1885]
    - [1885, 1886, 1913]
  test: [1913, 1914, 1941]  # touched ONCE, in Phase 6

evaluation:
  weight_window_days: 28  # WRMSSE-lite weights = revenue of the last N days before each cutoff

demand_class:             # Syntetos-Boylan, computed on data <= first fold train_end
  adi_threshold: 1.32
  cv2_threshold: 0.49
  min_nonzero_days: 2     # fewer non-zero days before cutoff -> insufficient_history

eda:
  stockout_zero_run_days: 14   # zero run this long on a frequently-selling item -> likely stockout
  revenue_window_days: 364     # window (ending at last fold valid_end) for the Pareto analysis

statistical:
  item_sample_size: 200   # 50 per demand class
  train_window_days: 730  # ARIMA/Prophet trained on the last 2 years for speed
  season: 7               # weekly seasonality for ETS / SARIMAX
  min_history_days: 56    # shorter histories fall back to the 28-day moving average
  n_jobs: -1              # joblib workers for per-series fits (-1 = all cores)
  sarima_grid:            # AIC grid, searched on fold F1 training data only
    p: [0, 1, 2]
    d: [0, 1, 2]
    q: [0, 1, 2]
    P: [0, 1]
    D: [0, 1]
    Q: [0, 1]
  sarima_maxiter: 50
  order_selection_items_per_class: 10   # items (from the 200-item sample) used to pick one order per class

lgbm:
  objective: tweedie      # compared against poisson & regression in Phase 5
  n_optuna_trials: 30
  lags: [28, 35, 42, 49, 56, 364]        # every target lag >= forecast.min_lag
  rolling_windows: [7, 14, 28, 56, 112]  # rolling mean/std on the target shifted by min_lag
  price_momentum_days: 28
  inner_valid_days: 28    # early stopping on the LAST days of each train fold (never the fold's validation)
  num_boost_round: 3000
  early_stopping_rounds: 100
  refit_full: true        # refit on the full train fold with the best iteration count
  train_window_days: null # null = all history; an integer keeps only the last N days per fold
  shap_sample_rows: 5000  # rows sampled (seed) for the SHAP summary in notebook 03
  params:                 # base LightGBM params (Optuna overrides some of them)
    learning_rate: 0.05
    num_leaves: 127
    min_data_in_leaf: 100
    feature_fraction: 0.8
    bagging_fraction: 0.8
    bagging_freq: 1
    lambda_l2: 0.1
    tweedie_variance_power: 1.1
    max_bin: 255
    num_threads: 0        # 0 = LightGBM default (all cores)
    verbosity: -1

inventory:                # ALL assumptions, documented in README
  review_period_days: 7
  lead_time_days: 3
  service_levels: [0.80, 0.85, 0.90, 0.95, 0.975, 0.99]
  holding_cost_rate_annual: 0.25   # fraction of item value per year
  sim_start_fold: F2               # F1 has no earlier fold to calibrate safety stock on (D-027)
  interval_levels: [0.80, 0.90, 0.95]   # coverage check of the cumulative (R + L) interval
  models_all_items: [seasonal_naive, moving_average, lgbm_tuned]
  models_sample: [seasonal_naive, sarimax, lgbm_tuned]   # 200-item sample (SARIMAX only there)

app:                      # Phase 8 dashboard: aggregate-only artifacts (D-033)
  history_days: 365
  interval_levels: [0.80, 0.95]    # daily two-sided intervals, calibrated on F1-F4
  planner_review_days: [7, 14]     # must divide the 28-day forecast period
  planner_lead_days: [1, 3, 7]
  forecast_models: [lgbm_tuned, sarimax, moving_average, seasonal_naive]
  item_models: [lgbm_tuned, moving_average, seasonal_naive]
  sample_models: [lgbm_tuned, sarimax, ets, moving_average, seasonal_naive, prophet]
  agg_models: [lgbm_tuned, sarimax, ets, moving_average, seasonal_naive, prophet]
